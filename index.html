<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        header {
            background: #35424a;
            color: #ffffff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            margin: 20px 0;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #35424a;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Awesome Webpage</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I'm a web enthusiast learning HTML and CSS. This is a simple webpage to showcase my skills.</p>
        <img src="https://via.placeholder.com/300" alt="Placeholder Image" />
    </section>

    <section id="gallery">
        <h2>Image Gallery</h2>
        <ul>
            <li><img src="https://via.placeholder.com/100" alt="Image 1" /></li>
            <li><img src="https://via.placeholder.com/100" alt="Image 2" /></li>
            <li><img src="https://via.placeholder.com/100" alt="Image 3" /></li>
        </ul>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <form action="#" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" required></textarea><br><br>
            <input type="submit" value="Send Message">
        </form>
    </section>

    <footer>
        <p>&copy; 2023 My Awesome Webpage</p>
    </footer>
</body>
</html>
